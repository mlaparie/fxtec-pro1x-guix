name: Build Pro1X images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      # C.UTF-8 (runner default) is incompatible with vanilla glibc in Guix
      # build sandboxes — guix-install-action sets this for the same reason.
      LANG: en_US.utf8

    steps:
      - uses: actions/checkout@v4

      # ── Free disk space ───────────────────────────────────────────────────
      # Runners arrive ~70% full; guix system image needs 15-25 GB headroom.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/lib/jvm \
                      /usr/share/swift /usr/local/julia* \
                      /opt/hostedtoolcache/CodeQL \
                      /opt/hostedtoolcache/node \
                      /opt/hostedtoolcache/Python \
                      /usr/share/doc /usr/share/man \
                      /usr/lib/firefox /snap
          sudo apt-get remove -y --purge \
            firefox mysql-server postgresql-* \
            libgl1-mesa-dri moby-* docker* \
            2>/dev/null || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo swapoff -a && sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
          df -h /

      # ── Host tools needed for image extraction ────────────────────────────
      - name: Install host tools
        run: sudo apt-get install -y --no-install-recommends util-linux e2fsprogs zstd

      # ── Install Guix ──────────────────────────────────────────────────────
      - name: Install Guix
        run: |
          curl -fsSL https://codeberg.org/guix/guix/raw/branch/master/etc/guix-install.sh \
            -o /tmp/guix-install.sh
          chmod +x /tmp/guix-install.sh
          echo | sudo -E /tmp/guix-install.sh
          sudo guix --version

      - name: Authorize nonguix substitute server
        run: |
          # Key from https://gitlab.com/nonguix/nonguix (README §Substitutes)
          sudo guix archive --authorize <<'EOF'
          (public-key
           (ecc
            (curve Ed25519)
            (q #C1FD53E5D4CE971933EC50C9F307AE2171A2D3B52C804642A7A35F84F3A4EA98#)))
          EOF
          # bordeaux.guix.gnu.org — has aarch64 substitutes that ci.guix.gnu.org lacks
          sudo guix archive --authorize <<'EOF'
          (public-key
           (ecc
            (curve Ed25519)
            (q #7D602902D3A2DBB83F8A0FB98602A754C5493B0B778C8D1DD4E0F41DE14DE34F#)))
          EOF
          # ARM runners lack CAP_SYS_ADMIN for build namespace mounts, so disable
          # the chroot/sandbox entirely (--disable-chroot is the current Guix flag;
          # --no-sandbox was removed).
          # guix-install.sh in unprivileged mode creates only a guix-daemon user,
          # NOT the guixbuild group.  Omit --build-users-group; builds then run
          # as the guix-daemon user directly (fine for CI).
          # Override ExecStart via drop-in; quote the substitute-urls value so
          # systemd treats the space-separated list as one argument.
          DAEMON=/var/guix/profiles/per-user/root/current-guix/bin/guix-daemon
          SUBS="https://ci.guix.gnu.org https://bordeaux.guix.gnu.org https://substitutes.nonguix.org"
          # Remount /tmp as a fresh writable tmpfs BEFORE restarting the daemon
          # so it inherits the new mount.  guix perform-download calls mkdtemp("/tmp/...")
          # which fails if the daemon was started before this remount.
          sudo mount -t tmpfs -o mode=1777,size=4G tmpfs /tmp
          # Build directories go to the root disk, not the 4G tmpfs: the
          # rootfs partition.img builder stages the whole system closure and
          # then the ext4 image in its build directory, which overflows 4G.
          BUILD_TMP=/var/tmp/guix-build
          sudo mkdir -p "$BUILD_TMP" && sudo chmod 1777 "$BUILD_TMP"
          # Ensure git-minimal (used by git-fetch builders) can read gitconfig.
          sudo touch /etc/gitconfig && sudo chmod 644 /etc/gitconfig
          sudo mkdir -p /etc/systemd/system/guix-daemon.service.d
          printf '[Service]\nExecStart=\nExecStart=%s --disable-chroot "--substitute-urls=%s"\nEnvironment="LANG=en_US.utf8"\nEnvironment="TMPDIR=%s"\nPrivateTmp=no\nOOMPolicy=continue\nTasksMax=8192\n' \
            "$DAEMON" "$SUBS" "$BUILD_TMP" \
            | sudo tee /etc/systemd/system/guix-daemon.service.d/ci.conf
          sudo systemctl daemon-reload
          sudo systemctl restart guix-daemon || {
            echo "==> guix-daemon failed to start:"; sudo journalctl -xeu guix-daemon --no-pager -n 50; exit 1
          }
          echo "Daemon PID: $(systemctl show guix-daemon -p MainPID --value)"
          # Create per-user profile dir expected by guix on ubuntu-24.04
          # (missing by default; fix from SystemCrafters/guix-installer).
          sudo mkdir -p /var/guix/profiles/per-user/runner
          sudo chown runner:runner /var/guix/profiles/per-user/runner

      # ── Guix build cache ──────────────────────────────────────────────────
      # What this job builds itself (kernel, u-boot, packages without
      # substitutes) is exported as a signed Guix archive at the end, even on
      # failure, and imported here on the next run: see .github/guix-cache.sh.
      # A raw /gnu/store cache does not work, since a fresh install has an
      # empty Guix database.  Per-run keys; restore takes the newest entry.
      #
      # To update channel pins in channels-ci.scm:
      #   git ls-remote https://codeberg.org/guix/guix refs/heads/master
      #   git ls-remote https://gitlab.com/nonguix/nonguix refs/heads/master
      - name: Restore Guix build cache
        uses: actions/cache/restore@v4
        with:
          path: /var/tmp/guix-cache
          key: guix-built-${{ github.run_id }}
          restore-keys: guix-built-

      - name: Import Guix build cache
        run: bash .github/guix-cache.sh import /var/tmp/guix-cache

      # ── Build U-Boot ──────────────────────────────────────────────────────
      # Running natively on aarch64.  The build is non-blocking (continue-on-error)
      # because the current uboot.scm produces a derivation that fails to build
      # from source in CI (see TODO.md §6).  The system-image step must not be
      # gated on u-boot until that is fixed.
      #
      # guix time-machine handles channel module loading (including nonguix)
      # automatically — no guix pull + GUILE_LOAD_PATH juggling needed.
      - name: Build u-boot-pro1x
        run: |
          guix time-machine --disable-authentication -C channels-ci.scm -- \
            build u-boot-pro1x \
            -L . \
            --no-grafts \
            --fallback \
            2>&1 | tee /tmp/uboot.log || true
          UBOOT=$(grep '^/gnu/store' /tmp/uboot.log | grep -v '\.drv' | tail -1)
          if [ -d "$UBOOT" ]; then
            cp "$UBOOT/libexec/u-boot-nodtb.bin"            u-boot-nodtb.bin
            cp "$UBOOT/libexec/sm6115-fxtec-pro1x.dtb"     sm6115-fxtec-pro1x.dtb
            echo "Built: $UBOOT"
          else
            echo "WARNING: u-boot-pro1x build failed (see TODO.md §6); skipping u-boot artifacts"
            tail -50 /tmp/uboot.log
            echo "==> glib build log (if present):"
            sudo zcat /var/log/guix/drvs/cw/hw7gfqdmkcj4n5m9z2ffd364q4vzd2-glib-2.86.5.drv.gz 2>/dev/null | grep -v '^$' | tail -80 || echo "(log not found)"
          fi

      # ── Diagnose git-fetch network access ────────────────────────────────
      # The daemon now runs as root (User= stripped from drop-in), so test as root.
      - name: Test network access from guix build user
        run: |
          # Show daemon service (check for PrivateNetwork or other net restrictions)
          systemctl cat guix-daemon || true
          cat /etc/systemd/system/guix-daemon.service.d/ci.conf || true
          # Test that git clone works as root (mimics guix-daemon git-fetch)
          GIT=$(ls /gnu/store/*/bin/git 2>/dev/null | grep -v lfs | head -1)
          echo "Guix git binary: ${GIT:-not found}"
          if [ -n "$GIT" ]; then
            sudo HOME=/root "$GIT" clone --bare --depth=1 \
              https://github.com/andersson/tqftpserv.git /tmp/git-test 2>&1 \
              && echo "git clone: OK" || echo "git clone FAILED (exit $?)"
          fi

      # ── Prefetch GitHub tarballs ──────────────────────────────────────────
      # The daemon's anonymous downloads from codeload.github.com got HTTP 429
      # (run 40731915977, kernel tarball) and no Guix mirror has them.  Fetch
      # them here with the job token and retries, then add them to the store
      # under the name and hash the packages expect.  A failure only warns:
      # the daemon still tries its own download.
      - name: Prefetch GitHub sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TM="guix time-machine --disable-authentication -C channels-ci.scm --"
          mkdir -p /tmp/prefetch
          $TM repl -L . .github/prefetch-sources.scm > /tmp/prefetch/list
          cat /tmp/prefetch/list
          while read -r url name; do
            curl -fsSL --retry 6 --retry-delay 20 --retry-all-errors \
              --location-trusted -H "Authorization: Bearer $GH_TOKEN" \
              -o "/tmp/prefetch/$name" "$url" \
              || { echo "WARNING: prefetch failed: $url"; rm -f "/tmp/prefetch/$name"; }
          done < /tmp/prefetch/list
          ls /tmp/prefetch/*.tar.gz >/dev/null 2>&1 \
            && $TM repl -L . .github/prefetch-sources.scm /tmp/prefetch/*.tar.gz
          rm -rf /tmp/prefetch

      # ── Build system image ────────────────────────────────────────────────
      - name: Build system image (mobile)
        run: |
          echo "==> disk space before build:"; df -h /
          guix time-machine --disable-authentication -C channels-ci.scm -- \
            system image \
            --image-type=efi-raw \
            --no-grafts \
            -L . \
            systems/mobile.scm \
            2>&1 | tee /tmp/image.log || true
          IMG=$(grep '^/gnu/store' /tmp/image.log | grep -v '\.drv' | tail -1)
          if [ ! -f "$IMG" ]; then
            echo "==> Image build failed — log:"; cat /tmp/image.log
            df -h / /tmp
            # Print the tail of each failed builder's own log.
            for drv in $(grep -o "builder for \`[^']*" /tmp/image.log | sed 's/.*`//' | sort -u); do
              base=$(basename "$drv")
              echo "==> log of $base:"
              sudo zcat "/var/log/guix/drvs/${base:0:2}/${base:2}.gz" 2>/dev/null | tail -60 \
                || echo "(log not found)"
            done
            exit 1
          fi
          echo "Built: $IMG"
          # Extract root ext4 partition (partition 2 in GPT efi-raw layout)
          PART_INFO=$(partx -o START,SECTORS -g -n 2 "$IMG")
          PART_START=$(echo "$PART_INFO" | awk '{print $1}')
          PART_SECTORS=$(echo "$PART_INFO" | awk '{print $2}')
          dd if="$IMG" of=rootfs.img bs=512 skip="$PART_START" count="$PART_SECTORS"
          LABEL=$(e2label rootfs.img 2>/dev/null || true)
          [ "$LABEL" = "guix" ] || e2label rootfs.img guix
          echo "rootfs: $(( PART_SECTORS / 2048 )) MiB"
          # Shrink to the minimum: the phone grows it back on first boot
          # (pro1x-rootfs-resize-service-type).
          e2fsck -fy rootfs.img || [ $? -le 1 ]
          resize2fs -M rootfs.img
          echo "rootfs after resize2fs -M: $(( $(stat -c %s rootfs.img) / 1048576 )) MiB"
          echo "==> disk space after extraction:"; df -h /

      # ── Save Guix build cache (also after a failed build) ─────────────────
      - name: Export Guix build cache
        if: always()
        run: bash .github/guix-cache.sh export /var/tmp/guix-cache

      - name: Save Guix build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /var/tmp/guix-cache
          key: guix-built-${{ github.run_id }}

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload u-boot
        if: hashFiles('u-boot-nodtb.bin') != ''
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-pro1x
          path: |
            u-boot-nodtb.bin
            sm6115-fxtec-pro1x.dtb
          retention-days: 30

      - name: Upload rootfs
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-mobile
          path: rootfs.img
          retention-days: 30

      # ── Cut a release when a tag is pushed ───────────────────────────────
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            u-boot-nodtb.bin
            sm6115-fxtec-pro1x.dtb
            rootfs.img
