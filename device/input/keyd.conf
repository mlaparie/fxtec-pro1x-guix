# keyd configuration for the F(x)tec Pro1X keyboard, installed as
# /etc/keyd/default.conf.
#
# Origin: the NixOS port's device/input/keyd.conf (Fn layer of yellow
# symbols for Finnish keycaps).  Changed here, after the Pro1 keymap in
# droidian-devices/linux-android-fxtec-pro1 PR #2 (Kabouik, from work by
# NotKit and nsensfel), adapted to the Pro1X matrix:
#   - the two yellow slant arrows (KEY_FN) are Super;
#   - the F(x) key (KEY_HOMEPAGE) is the Fn modifier;
#   - Fn gives F1-F12, media, brightness and navigation keys, not the yellow
#     symbols (those are Shift or AltGr combinations on us/us-intl);
#   - the Pro1X has no grave or backslash key, so ` ~ \ | stay on Fn+letter,
#     and Wi-Fi/Bluetooth (on those keys in the Pro1 PR) go to Fn+W/Fn+B.
# Test what a key sends with `keyd monitor`.

[ids]
-0001:0001:5dc97cd9
*
k:0001:0001

[main]
fn = layer(meta)
homepage = layer(fn)

[fn]
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
minus = f11
equal = f12

comma = volumedown
dot = volumeup
semicolon = playpause
apostrophe = mute
leftbrace = brightnessdown
rightbrace = brightnessup
w = wlan
b = bluetooth

enter = menu
backspace = scrolllock
up = pageup
down = pagedown
left = home
right = end
delete = insert

q = grave
n = S-grave
l = backslash
z = S-backslash
