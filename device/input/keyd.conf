# keyd configuration for the F(x)tec Pro1X keyboard, installed as
# /etc/keyd/default.conf.
#
# Origin: the NixOS port's device/input/keyd.conf (Fn layer of yellow
# symbols for Finnish keycaps).  Changed here, after the Pro1 keymap in
# droidian-devices/linux-android-fxtec-pro1 PR #2 (Kabouik, from work by
# NotKit and nsensfel), adapted to the Pro1X matrix:
#   - the two yellow slant arrows (KEY_FN) are Super;
#   - the F(x) key (KEY_HOMEPAGE) is the Fn modifier;
#   - Fn gives F1-F12, media, brightness and navigation keys, not the yellow
#     symbols (those are Shift or AltGr combinations on us/us-intl);
#   - the key labelled ` ~ (row 4, column 2) sends KEY_102ND, which us-intl
#     reads as \ |; it is remapped to grave.  Wi-Fi/Bluetooth (on the
#     backslash and grave keys in the Pro1 PR) go to Fn+W/Fn+B;
#   - the key labelled Sym, left of space (KEY_RIGHTALT), types \ and, with
#     Shift, | (there is no backslash key; / ? have their own key);
#     Fn+Sym is AltGr (us-intl accents);
#   - Fn gives some of the yellow keycap symbols: Fn+l ;  Fn+p \  Fn+/ |
#   - the key right of L types ? and, with Shift, : (not ; and :); the key
#     left of the up arrow types / and, with Shift, | (not / and ?); ; stays
#     on Fn+l (author, 2026-10-30);
#   - Fn+s is Print (sysrq), for screenshots in Sway
# Test what a key sends with `keyd monitor`.

[ids]
-0001:0001:5dc97cd9
*
k:0001:0001

[main]
fn = layer(meta)
homepage = layer(fn)
102nd = grave
rightalt = backslash
semicolon = S-slash

[shift]
semicolon = S-semicolon
slash = S-backslash

[fn]
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
minus = f11
equal = f12

comma = volumedown
dot = volumeup
semicolon = playpause
apostrophe = mute
leftbrace = brightnessdown
rightbrace = brightnessup
w = wlan
b = bluetooth
s = sysrq

enter = menu
backspace = scrolllock
up = pageup
down = pagedown
left = home
right = end
delete = insert
rightalt = rightalt

l = semicolon
p = backslash
slash = S-backslash
