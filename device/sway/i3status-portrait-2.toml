# i3status-rust bar for sway on the F(x)tec Pro1X: portrait, second line (pro1x-bar).
# Based on mlaparie's guix-config (.config/i3status-rust/config.toml), with the
# PC-specific blocks removed and phone ones added.  Installed as
# ~/.config/i3status-rust/config.toml for new accounts.  Icons need font-awesome.
# No backlight block: polling actual_brightness makes the panel driver send
# DSI reads, which time out in video mode and wedge the panel (it turned
# white until reboot, 2026-10-28).

[theme]
theme = "nord-dark"

[theme.overrides]
idle_bg = "#313544"
idle_fg = "#B1B1B1"

[icons]
icons = "awesome4"

[[block]]
block = "focused_window"
[block.format]
full = " $title.str(max_w:40) "
short = " $title.str(max_w:20) "

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
interval = 30
format = " $icon $available "

[[block]]
block = "time"
interval = 60
format = " $timestamp.datetime(f:'%a %d %b') "
