# ~/.config/foot/foot.ini — your foot settings on the Pro¹x.
#
# The port's (font, opacity, terminal bell on the LED) are included first
# and follow deploys; put your own after them, a later value wins.

[main]
include=/run/current-system/profile/share/pro1x-sway/foot.ini

# Examples:
# font=Iosevka Term:size=12
# [colors-dark]
# alpha=1.0
