# The port's foot settings on the Pro¹x, included by ~/.config/foot/foot.ini
# (foot-user.ini, seeded for new accounts) and updated by every deploy.
# Iosevka Term (font-iosevka-term); 90% opaque windows, blurred by
# SwayFX; the terminal bell lights the notification LED (feedbackd's
# bell-terminal event, white by default in the author's config.scm).

[main]
font=Iosevka Term:size=11

[colors-dark]
alpha=0.9

[bell]
command=fbcli -E bell-terminal -t 10
command-focused=yes
