# foot defaults for new accounts on the Pro¹x (~/.config/foot/foot.ini).
# 90% opaque windows (Sway has no blur); the terminal bell lights the notification LED
# (feedbackd's bell-terminal event, white by default in the author's
# config.scm).

[colors-dark]
alpha=0.9

[bell]
command=fbcli -E bell-terminal -t 10
command-focused=yes
