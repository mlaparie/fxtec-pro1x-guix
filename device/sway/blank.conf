# blank.conf: the Sway mode while the panel is blanked (pro1x-idle).
#
# The key that wakes the panel stops here instead of reaching the focused
# window: Escape pressed to light the screen used to close or interrupt
# what was open (author, 2026-11-21).  Every key of the keyboard (evdev
# codes 1-127, Sway codes 9-135) is bound to nothing, except the volume
# keys, which keep their usual action below.  A key held with a modifier
# still goes through (Sway matches the modifiers exactly).  pro1x-idle
# enters the mode on blank, only from the default mode, and leaves it on
# resume.  Generated with:
#   for c in $(seq 9 135); do case $c in 121|122|123) ;; *) echo "    bindcode $c nop";; esac; done
mode "pro1x-blanked" {
    bindcode 9 nop
    bindcode 10 nop
    bindcode 11 nop
    bindcode 12 nop
    bindcode 13 nop
    bindcode 14 nop
    bindcode 15 nop
    bindcode 16 nop
    bindcode 17 nop
    bindcode 18 nop
    bindcode 19 nop
    bindcode 20 nop
    bindcode 21 nop
    bindcode 22 nop
    bindcode 23 nop
    bindcode 24 nop
