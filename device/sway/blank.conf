# blank.conf: the Sway mode while the panel is blanked (pro1x-idle).
#
# The key that wakes the panel stops here instead of reaching the focused
# window: Escape pressed to light the screen used to close or interrupt
# what was open (author, 2026-11-21).  Every key of the keyboard (evdev
# codes 1-127, Sway codes 9-135) is bound to nothing, except the volume
# keys, which keep their usual action below.  Only for the phone's own
# keyboard, through each device it reaches Sway by (keyd, then xremap):
# a stream's virtual keyboard still types, on the lock screen for one.
# A key held with a modifier still goes through (Sway matches the
# modifiers exactly).  pro1x-idle and pro1x-power-key enter the mode on
# blank, only from the default mode, and leave it on resume.  Generated
# with:
#   for d in 1:1:Pro1X_keyboard 4012:2782:keyd_virtual_keyboard 4660:22136:xremap; do
#     for c in $(seq 9 135); do case $c in 121|122|123) ;; *) echo "    bindcode --input-device=$d $c nop";; esac; done; done
