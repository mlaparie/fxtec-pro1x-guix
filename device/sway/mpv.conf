# The port's mpv settings, included by ~/.config/mpv/mpv.conf.

# Cheaper scaling: with mpv's default (lanczos), 1080p played slower than
# real time on the Adreno 610.
profile=fast
# Vulkan does not work for mpv on this GPU (Turnip offers only Vulkan 1.0).
gpu-api=opengl
# Venus decodes H.264 (and HEVC, VP8, VP9 as the firmware allows): a 1080p
# clip took 1.3 s of CPU against 4.1 s in software (2026-11-20).  -copy:
# the frames come back to memory, which mpv's OpenGL output takes on this
# GPU; a codec Venus refuses falls back to software by itself.
hwdec=v4l2m2m-copy
