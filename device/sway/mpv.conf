# mpv's system-wide settings on the Pro¹x (etc/xdg/mpv/mpv.conf in the
# system profile, which is in XDG_CONFIG_DIRS).  ~/.config/mpv/mpv.conf
# overrides each setting it sets.
#
# Video decoded by Venus, the SoC's decoder (V4L2 mem2mem: H.264, HEVC,
# VP9; VA-API has no driver for it).  -copy brings the frames back to
# memory, which every video output takes.  A codec it cannot do falls back
# to software.  A 720p test clip took about a quarter of the CPU of
# software decoding (H.264 1.6 s against 5.4 s, HEVC 1.4 s against 6.8 s,
# 2026-11-21).
hwdec=v4l2m2m-copy
