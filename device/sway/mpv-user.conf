# ~/.config/mpv/mpv.conf — your mpv settings on the Pro¹x.
#
# The port's (hardware decoding on Venus, fast scaling, OpenGL) are included
# first and follow deploys; put your own after them, a later value wins.
# In an mpv.conf of your own (one made before this skeleton, or copied from
# another machine), the same line at its top brings them in:
#
#   include=/run/current-system/profile/share/pro1x-sway/mpv.conf
include=/run/current-system/profile/share/pro1x-sway/mpv.conf
