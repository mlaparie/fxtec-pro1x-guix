# wob, the on-screen bar for volume and brightness (pro1x-osd).
timeout = 1000
max = 100
width = 360
height = 28
border_offset = 3
border_size = 2
bar_padding = 3
anchor = bottom
margin = 120
background_color = 1d2021e6
border_color = 458588ff
bar_color = ebdbb2ff
overflow_mode = nowrap

[style.muted]
bar_color = 665c54ff
