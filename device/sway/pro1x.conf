# Pro¹x device settings for sway, shared by every sway-based session.
#
# Installed as /etc/sway/config.d/pro1x.conf.  The Sway session's config
# (device/sway/config) includes /etc/sway/config.d/*, and so does Sxmo's
# sway template, so both sessions get the same panel rotation, scale,
# keyboard layout and touch mapping.  Put session-specific settings
# (bindings, bar, colours) in the session's own config, not here.
#
# State: Sway session tested with these settings before the split
# (TODO.md); Sxmo with them not tested yet.

# 1080x2160 portrait panel, used in landscape with the keyboard out.
output DSI-1 {
    transform 90
    scale 2
}

input type:keyboard {
    xkb_layout us
    xkb_variant intl
    repeat_delay 300
    repeat_rate 30
}
# Touch follows the panel rotation.
input type:touch map_to_output DSI-1
seat * hide_cursor 3000
