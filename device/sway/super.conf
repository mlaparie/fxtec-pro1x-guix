# super.conf — Sway's "super" mode (pro1x-super start): each key below is sent
# again with Super (pro1x-super key), so the user's Super bindings run.
# Escape leaves.  Written by a shell loop over the four modifier sets and the
# keys below; keep the lines uniform.
mode "super" {
    bindsym Escape mode default; exec pro1x-super leave
    bindsym 0 mode default; exec pro1x-super key 0
    bindsym 1 mode default; exec pro1x-super key 1
    bindsym 2 mode default; exec pro1x-super key 2
    bindsym 3 mode default; exec pro1x-super key 3
