# SwayFX effects (the "1 Sway" session): blur behind translucent windows
# (foot at 90%).  No rounded corners (author, 2026-10-31).
blur enable
blur_passes 2
blur_radius 4
# Inactive windows slightly dimmed: 0.05, as on the author's PC (2026-11-06).
default_dim_inactive 0.05
# Windows open and close with a 200 ms animation (author, 2026-11-06).
# SwayFX 0.6 animates nothing else: no workspace switches.
animation_duration_ms 200
