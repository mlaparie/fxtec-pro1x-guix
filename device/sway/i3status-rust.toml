# i3status-rust bar for sway on the F(x)tec Pro1X.
# Based on mlaparie's guix-config (.config/i3status-rust/config.toml), with the
# PC-specific blocks removed and phone ones added.  Installed as
# ~/.config/i3status-rust/config.toml for new accounts.  Icons need font-awesome.
# No backlight block: polling actual_brightness makes the panel driver send
# DSI reads, which time out in video mode and wedge the panel (it turned
# white until reboot, 2026-10-28).

[theme]
theme = "nord-dark"

[theme.overrides]
idle_bg = "#313544"
idle_fg = "#B1B1B1"

[icons]
icons = "awesome4"

[[block]]
block = "focused_window"
[block.format]
full = " $title.str(max_w:40) |"
short = " $title.str(max_w:10) |"

[[block]]
block = "cpu"
interval = 2
format = " $barchart $utilization "

[[block]]
block = "memory"
format = " $icon $mem_avail free "
interval = 5
warning_mem = 80
critical_mem = 95

[[block]]
block = "net"
device = "wlan0"
format = " $icon $signal_strength "
format_alt = " $icon $ssid $ip "
interval = 5
inactive_format = ""
missing_format = ""

[[block]]
block = "battery"
driver = "sysfs"
device = "battery"
interval = 10
format = " $icon $percentage "
good = 101
info = 60
warning = 30
critical = 15

[[block]]
block = "custom"
command = "pro1x-status temp"
interval = 10
format = " $text "

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
interval = 60
format = " $icon $available "

# Mobile data: access technology and signal (ModemManager).
[[block]]
block = "custom"
command = "pro1x-status mobile"
interval = 30
format = " $text "
hide_when_empty = true

# Volume through pipewire-pulse; left click mutes.
[[block]]
block = "sound"
driver = "pulseaudio"
format = " $icon $volume "

# Bluetooth on/off (rfkill); left click toggles.
[[block]]
block = "custom"
command = "pro1x-status bt"
interval = 30
format = " $text "
[[block.click]]
button = "left"
cmd = "pro1x-status bt-toggle"
update = true

# Brightness from the backlight's brightness file (not actual_brightness,
# see pro1x-status); scroll to change it.
[[block]]
block = "custom"
command = "pro1x-status bright"
interval = 30
format = " ☀ $text "
[[block.click]]
button = "up"
cmd = "pro1x-status bright-up"
update = true
[[block.click]]
button = "down"
cmd = "pro1x-status bright-down"
update = true

[[block]]
block = "time"
interval = 10
format = " $timestamp.datetime(f:'%a %d, %R') "
