# i3status-rust bar for sway on the F(x)tec Pro1X.
# Based on mlaparie's guix-config (.config/i3status-rust/config.toml), with the
# PC-specific blocks removed and phone ones added.  Installed as
# ~/.config/i3status-rust/config.toml for new accounts.  Icons need font-awesome.
# No backlight block: polling actual_brightness makes the panel driver send
# DSI reads, which time out in video mode and wedge the panel (it turned
# white until reboot, 2026-10-28).

[theme]
theme = "nord-dark"

[theme.overrides]
idle_bg = "#313544"
idle_fg = "#B1B1B1"

[icons]
icons = "awesome4"

[[block]]
block = "focused_window"
[block.format]
full = "{ $title.str(max_w:40) |}"
short = "{ $title.str(max_w:10) |}"

# Order (author, 2026-10-31): window, load, temperature, memory, storage,
# Wi-Fi, mobile, volume, brightness, Bluetooth, battery, date.  Blocks
# that read a file run every 1-2 s; the shell commands every 2 s;
# ModemManager (mmcli, a D-Bus round trip) every 5 s; storage every 30 s.

[[block]]
block = "load"
interval = 1
format = " $icon $1m.eng(w:4) "

[[block]]
block = "custom"
command = "pro1x-status temp"
interval = 2
format = " $text "

[[block]]
block = "memory"
format = " $icon $mem_avail free "
interval = 1
warning_mem = 80
critical_mem = 95

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
interval = 30
format = " $icon $available "

[[block]]
block = "net"
device = "wlan0"
format = " $icon $signal_strength "
format_alt = " $icon $ssid $ip "
interval = 2
inactive_format = ""
missing_format = ""

# Mobile data: access technology and signal (ModemManager).
[[block]]
block = "custom"
command = "pro1x-status mobile"
interval = 5
format = " \uf012 $text "
hide_when_empty = true

# Volume through pipewire-pulse (follows changes); left click mutes.
[[block]]
block = "sound"
driver = "pulseaudio"
format = " $icon {$volume|muted} "

# Brightness from the backlight's brightness file (not actual_brightness,
# see pro1x-status); scroll to change it.
[[block]]
block = "custom"
command = "pro1x-status bright"
interval = 2
format = " ☀ $text "
[[block.click]]
button = "up"
cmd = "pro1x-status bright-up"
update = true
[[block.click]]
button = "down"
cmd = "pro1x-status bright-down"
update = true

# Bluetooth icon, coloured when on (rfkill); left click toggles.
[[block]]
block = "custom"
command = "pro1x-status bt"
json = true
interval = 2
format = " $icon "
[[block.click]]
button = "left"
cmd = "pro1x-status bt-toggle"
update = true

[[block]]
block = "battery"
driver = "sysfs"
device = "battery"
interval = 2
format = " $icon $percentage "
# The other states default to the icon alone; always show the percentage.
full_format = " $icon $percentage "
charging_format = " $icon $percentage "
empty_format = " $icon $percentage "
not_charging_format = " $icon $percentage "
good = 101
info = 60
warning = 30
critical = 15

[[block]]
block = "time"
interval = 1
format = " $timestamp.datetime(f:'%a %d, %R') "
