# libcamera 0.7 software ISP tuning for the Pro1X imx582.
# Only BlackLevel, Ccm and Af read tuning data; Awb, Adjust and Agc use fixed constants.
version: 1
algorithms:
  - BlackLevel:
      # 16-bit value, libcamera uses it >> 8. 4096 = 16/255, matching the sensor helper.
      blackLevel: 4096
  - Awb:
  # The phone's own calibration: Qualcomm's colour correction (cc13) for this
  # module, from the stock vendor partition (com.qti.tuned.lce_imx582.bin),
  # the set for normal light.  Each matrix is the middle of its range (2000-2550,
  # 2750-3300, 3500-4700, 4800-5500, 5800-6900 K); rows R, G, B, each summing
  # to 1.  libcamera interpolates by the colour temperature its white balance
  # estimates.
  - Ccm:
      ccms:
        - ct: 2275
          ccm: [ 1.7678, -0.5485, -0.2194,
                -0.4910,  1.4456,  0.0454,
                -0.4216, -0.8363,  2.2579 ]
        - ct: 3025
          ccm: [ 1.7084, -0.6534, -0.0551,
                -0.2776,  1.2349,  0.0427,
                -0.1214, -1.0338,  2.1553 ]
        - ct: 4100
          ccm: [ 1.5919, -0.7385,  0.1466,
                -0.2534,  1.3775, -0.1241,
                 0.1252, -0.9807,  1.8555 ]
        - ct: 5150
          ccm: [ 1.3496, -0.2878, -0.0618,
                -0.1292,  1.1941, -0.0650,
                 0.0652, -0.6676,  1.6024 ]
        - ct: 6350
          ccm: [ 1.3727, -0.3210, -0.0517,
                -0.0971,  1.2135, -0.1164,
                 0.0829, -0.6625,  1.5796 ]
  - Adjust:
  - Agc:
  # Contrast autofocus (libipa hill climbing on the software ISP sharpness value); the
  # imx582 has the dw9800 lens, the s5k4h7 is fixed focus.
  - Af:
      # Measured on the Pro1-X (2026-10-25): the sharpness peak is about +-40 codes wide
      # (near object: 729 / 951 / 765 at 420 / 450 / 480), so coarse 64 and fine 16
      # steps are enough. Stats come every 4th frame; 2 ignored measurements cover the
      # lens settling and debounce a refocus.
      coarseStep: 64
      fineStep: 16
      fineRange: 0.08
      ignoreFrames: 2
      # A far-focused frame of a near object loses less than the libipa default 50% of
      # sharpness, which left refocus waiting; noise between measurements is 1-3%.
      maxChange: 0.3
