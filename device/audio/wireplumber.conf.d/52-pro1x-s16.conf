# PipeWire would open the PCM as S24_LE, which comes out about 40 dB too quiet on this
# card (the same tone through aplay S16_LE is normal). Force 16-bit.
#
# Origin: the NixOS port's device/audio/wireplumber.conf.d/52-pro1x-s16.conf.  On Guix
# the nodes are named alsa_output._sys_devices_platform_sound_sound_card0.*, not
# alsa_output.platform-sound.*, so the rule also matches on the card name (it did not
# apply before: S24_LE, sound barely audible at full volume, 2026-10-29).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
      { node.name = "~alsa_input.platform-sound.*" }
      { node.name = "~alsa_output.*", alsa.card_name = "F(x)tec Pro1X" }
      { node.name = "~alsa_input.*", alsa.card_name = "F(x)tec Pro1X" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
      }
    }
  }
]
